# Keeps the PDFs in docs/ in sync with the sources on main.
name: Docs

on:
  push:
    branches: [main]
    paths: ["lib.typ", "src/**", "template/**", "examples/**", "typst.toml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: typst-community/setup-typst@v5
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - run: make docs
      - name: Commit changed PDFs
        run: |
          if git diff --quiet -- docs; then
            echo "docs/ is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate PDFs" -- docs
          git push
